# AI 文章分类配置
# 用于 RSS 聚合器的文章分类

categories:
  - key: ai_application
    name: AI应用
    description: 关于AI在实际场景中的应用、产品、解决方案

  - key: harness_engineering
    name: Harness工程
    description: 关于AI工程实践、评估、测试、部署、监控、工具链、MLOps

  - key: ai_model
    name: AI模型
    description: 关于新模型、模型架构、训练方法、模型优化

  - key: embodied_ai
    name: 具身智能
    description: 关于机器人、物理世界交互、embodied AI

  - key: ai_chip
    name: AI芯片
    description: 关于AI训练芯片、AI推理芯片

  - key: military_tech
    name: 军事技术
    description: 关于军事装备、武器系统、国防技术、军事战略、防务政策、军事行动

  - key: compiler
    name: 编译器
    description: 关于编译器技术、优化、前端后端、IR设计、JIT、AOT、静态分析、代码生成

  - key: economy
    name: 经济
    description: 关于经济动态、金融市场、商业趋势、宏观经济、产业分析、企业财报

  - key: politics
    name: 时政
    description: 关于国际政治、地缘政治、外交关系、政策法规、政府决策、国家安全、社会治理

# 默认分类（如果无法分类时使用）
default_category: ai_application

# 是否启用未分类类别
enable_uncategorized: true
