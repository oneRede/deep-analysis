# RSS/Atom Feeds 配置文件 - 修复版
# 优化日期: 2026-08-18
# 修复原则: 仅保留可验证的 RSS 源，移除无效地址

# Tier 1 - 高权重（学术 + 已验证的官方博客）
tier1:
  # ============================================================
  # 学术论文 - 绝对主力 (68% 收录率) ✅ 已验证
  # ============================================================

  - name: "arXiv cs.CL (计算与语言)"
    url: "http://export.arxiv.org/rss/cs.CL"
    type: "arxiv"
    priority: "high"
    keywords:
      - "Large Language Model"
      - "LLM"
      - "Transformer"
      - "Attention"
      - "GPT"
      - "BERT"
      - "Language Model"
      - "NLP"

  - name: "arXiv cs.AI (人工智能)"
    url: "http://export.arxiv.org/rss/cs.AI"
    type: "arxiv"
    priority: "high"
    keywords:
      - "Foundation Model"
      - "Neural Network"
      - "Deep Learning"
      - "Reinforcement Learning"

  - name: "arXiv cs.LG (机器学习)"
    url: "http://export.arxiv.org/rss/cs.LG"
    type: "arxiv"
    priority: "high"
    keywords:
      - "MoE"
      - "Mixture of Experts"
      - "Model Training"
      - "RLHF"
      - "Optimization"
      - "Scaling"

  - name: "arXiv cs.RO (机器人)"
    url: "http://export.arxiv.org/rss/cs.RO"
    type: "arxiv"
    priority: "high"
    keywords:
      - "Robot"
      - "Embodied"
      - "Manipulation"
      - "Navigation"
      - "Humanoid"

  - name: "arXiv cs.CV (计算机视觉)"
    url: "http://export.arxiv.org/rss/cs.CV"
    type: "arxiv"
    priority: "medium"
    keywords:
      - "Vision Language"
      - "Multimodal"
      - "VLM"
      - "World Model"
      - "3D Vision"

  - name: "arXiv cs.AR (硬件架构)"
    url: "http://export.arxiv.org/rss/cs.AR"
    type: "arxiv"
    priority: "high"
    keywords:
      - "AI accelerator"
      - "hardware"
      - "chip"
      - "GPU"
      - "FPGA"
      - "ASIC"
      - "NPU"
      - "memory"
      - "compute-in-memory"
      - "sparse"

  # ============================================================
  # 已验证的官方博客 ✅
  # ============================================================

  - name: "NVIDIA Technical Blog"
    url: "https://developer.nvidia.com/blog/feed/"
    type: "blog"
    priority: "high"
    keywords:
      - "GPU"
      - "Training"
      - "Inference"
      - "NVLink"
      - "Tensor Core"
      - "CUDA"

  - name: "NVIDIA AI Blog"
    url: "https://blogs.nvidia.com/blog/category/deep-learning/feed/"
    type: "blog"
    priority: "high"
    keywords:
      - "AI"
      - "Deep Learning"
      - "Robotics"
      - "Isaac"

  - name: "Google DeepMind Blog"
    url: "https://deepmind.google/blog/rss.xml"
    type: "blog"
    priority: "high"
    # 虽有解析警告但可用

  # ============================================================
  # 主流大模型公司 - 通过网页爬取获取（见 web_scraper.py）
  # ============================================================
  # 以下公司的官方博客/研究页面通过自定义爬虫获取：
  # ✅ DeepSeek Blog: https://deepseek.ai/blog
  # ✅ Qwen Blog: https://qwenlm.github.io/blog/
  # ✅ Zhipu AI Research: https://www.zhipuai.cn/en/research/
  # ✅ Kimi (Moonshot AI) Blog: https://platform.kimi.ai/blog
  # ✅ Anthropic Research: https://www.anthropic.com/research
  # ✅ OpenAI News & Research: https://openai.com/news, https://openai.com/research
  # ✅ xAI (Grok) Blog: https://x.ai/blog
  #
  # 使用 cloudscraper 库绕过 Cloudflare 防护

  # ============================================================
  # 具身智能公司 - 通过网页爬取获取
  # ============================================================
  # 国际:
  # ✅ Physical Intelligence: https://www.physicalintelligence.company/blog (~7篇/周)
  # ✅ Skild AI: https://www.skild.ai/blogs
  # ✅ Figure AI: https://www.figure.ai/news
  # ✅ 1X Technologies: https://www.1x.tech/discover (~11篇/周)
  #
  # 中国:
  # ✅ UBTECH (优必选): https://www.ubtrobot.com/en/news-list (~4篇/周)
  # ✅ Unitree (宇树科技): https://www.unitree.com/ (~4篇/周)
