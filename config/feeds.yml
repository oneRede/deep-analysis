  # ✅ Cerebras: https://www.cerebras.ai/blog (~44篇/周，极活跃)
  # ✅ SambaNova: https://sambanova.ai/blog
  # ✅ Tenstorrent: https://tenstorrent.com/newsroom (~13篇/周)
  # ✅ Etched: https://etched.com/progress
  # ✅ D-Matrix: https://www.d-matrix.ai/blog (~6篇/周，已解决 Cloudflare 403)
  #     方案：Firefox/Windows + 会话预热 + 重试机制
  #
  # 中国:
  # ✅ Cambricon (寒武纪): https://www.cambricon.com/ (科创板上市)
  # ✅ Iluvatar (天数智芯): https://www.iluvatar.com/news
  # ✅ Enflame (燧原科技): https://www.enflame-tech.com/news (~8篇/周)
  # ✅ MetaX (沐曦): https://www.metax-tech.com/news.html
  # ✅ Biren (壁仞科技): https://www.birentech.com/news/ (~8篇/周，港股上市)
  #
  # 关注：AI加速器、推理芯片、训练芯片、国产替代
  #
  # 这些源会在 fetch_all() 中自动爬取，无需在此配置

