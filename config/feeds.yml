# 全局过滤配置
filters:
  # 排除关键词（降低噪音）
  exclude_keywords:
    - "sponsored"
    - "advertisement"
    - "webinar"
    - "hiring"
    - "招聘"
    - "融资"
    - "收购"
    - "访谈"
    - "interview"
    - "募资轮"
    - "AMA"
    - "megathread"

  # 最小标题长度（过滤垃圾信息）
  min_title_length: 15

  # 时间窗口（天数）
  days_lookback: 7

